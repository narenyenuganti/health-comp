<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>You’re invited to a HealthComp challenge</title>
  <meta name="description" content="Join a private 7-day Activity competition. Raw Health data stays on each iPhone.">
  <meta property="og:site_name" content="HealthComp">
  <meta property="og:title" content="You’re invited to a HealthComp challenge">
  <meta property="og:description" content="Join a private 7-day Activity competition. Raw Health data stays on each iPhone.">
  <meta property="og:image" content="https://healthcomp.app/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <style>
    :root { color-scheme: light dark; --ground: #FAFAF7; --ink: #111; --muted: #6b6b6b; }
    @media (prefers-color-scheme: dark) { :root { --ground: #0F0F10; --ink: #f5f5f5; --muted: #9a9a9a; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--ground); color: var(--ink);
           font: 17px/1.45 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; text-align: center; }
    main { padding: 24px; max-width: 420px; }
    img { width: 96px; height: 96px; border-radius: 22px; }
    h1 { font-size: 28px; line-height: 1.15; margin: 20px 0 8px; }
    p { color: var(--muted); margin: 0 0 28px; }
    a.button { display: block; padding: 16px; border-radius: 14px; background: var(--ink); color: var(--ground);
               font-weight: 600; text-decoration: none; }
    [hidden] { display: none !important; }
    small { display: block; margin-top: 16px; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <img src="/apple-touch-icon.png" alt="">
    <h1>You’re invited to a HealthComp challenge</h1>
    <p>Join a private 7-day Activity competition. Raw Health data stays on each iPhone.</p>
    <a class="button" id="open" hidden>Open in HealthComp</a>
    <small>Open this link on an iPhone with HealthComp installed. It works once.</small>
  </main>
  <script>
    // Fallback for when iOS opens the page in Safari instead of the app.
    const token = location.pathname.split("/")[2] || "";
    if (/^[A-Za-z0-9_-]{43}$/.test(token)) {
      const open = document.getElementById("open");
      open.href = "healthcomp://invite/" + token;
      open.hidden = false;
    }
  </script>
</body>
</html>
