<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>Open in HealthComp to challenge them</title>
  <meta name="description" content="Someone shared their HealthComp challenge link. Open it on an iPhone with HealthComp installed.">
  <meta property="og:site_name" content="HealthComp">
  <meta property="og:title" content="HealthComp challenge link">
  <meta property="og:description" content="Someone shared their HealthComp challenge link. Open it on an iPhone with HealthComp installed.">
  <meta property="og:image" content="https://healthcomp.app/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="/apple-touch-icon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <style>
    :root { color-scheme: light dark; --ground: #FAFAF7; --ink: #111111; --secondary: #5E5E62; }
    @media (prefers-color-scheme: dark) { :root { --ground: #0F0F10; --ink: #F5F5F0; --secondary: #A3A3A8; } }
    body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; background: var(--ground); color: var(--ink);
           font: 17px/1.45 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; text-align: center; }
    main { padding: 24px; max-width: 420px; }
    img { width: 96px; height: 96px; border-radius: 22px; }
    h1 { font-size: 28px; font-weight: 800; font-stretch: condensed; line-height: 1.15; margin: 16px 0 8px; }
    p { color: var(--secondary); margin: 0 0 28px; }
    a.button { display: block; padding: 16px; border-radius: 14px; background: var(--ink); color: var(--ground);
               font-weight: 600; text-decoration: none; }
    [hidden] { display: none !important; }
    .waitlist { display: inline-block; margin-top: 16px; padding: 12px 0; color: var(--secondary); text-underline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <img src="/apple-touch-icon.png" alt="">
    <h1>Open in HealthComp to challenge them</h1>
    <p>Someone shared their HealthComp challenge link. Open it on an iPhone with HealthComp installed.</p>
    <a class="button" id="open" hidden>Open in HealthComp</a>
    <a class="waitlist" href="/">No HealthComp yet? It’s in private beta. Join the waitlist.</a>
  </main>
  <script>
    // Fallback for when iOS opens the page in Safari instead of the app.
    const code = location.pathname.split("/")[2] || "";
    // Only an iPhone can open the app; elsewhere the custom scheme just errors.
    if (/iPhone/.test(navigator.userAgent) && /^[A-Za-z0-9_-]{22}$/.test(code)) {
      const open = document.getElementById("open");
      const scheme = location.hostname === "staging.healthcomp.app"
        ? "healthcomp-staging" : "healthcomp";
      open.href = scheme + "://challenge/" + code;
      open.hidden = false;
    }
  </script>
</body>
</html>
