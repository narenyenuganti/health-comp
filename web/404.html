<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found</title>
  <link rel="icon" href="/apple-touch-icon.png">
  <style>
    /* Pages serves this at any unknown path, so every URL here is absolute. */
    :root { color-scheme: light dark; --ground: #FAFAF7; --ink: #111111; --secondary: #5E5E62; }
    @media (prefers-color-scheme: dark) { :root { --ground: #0F0F10; --ink: #F5F5F0; --secondary: #A3A3A8; } }
    body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; background: var(--ground);
           color: var(--ink); font: 17px/1.45 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; text-align: center; }
    main { padding: 24px; max-width: 420px; }
    svg { display: block; width: 88px; margin: 0 auto; }
    h1 { font-size: 28px; font-weight: 800; font-stretch: condensed; line-height: 1.15; margin: 16px 0 8px; }
    p { margin: 0 0 28px; color: var(--secondary); }
    h1, p { text-wrap: balance; }
    a { display: block; padding: 16px; border-radius: 14px; background: var(--ink); color: var(--ground);
        font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 100 80" aria-hidden="true">
      <polygon fill="#E4003A" points="17.4,8 57.4,8 53.8,26 13.8,26"/>
      <polygon fill="#009A4E" points="22.8,31 52.8,31 49.2,49 19.2,49"/>
      <polygon fill="#0072BC" points="12.2,54 48.2,54 44.6,72 8.6,72"/>
      <polygon fill="currentColor" points="63.4,8 91.4,8 78.6,72 50.6,72"/>
    </svg>
    <h1>Page not found</h1>
    <p>There’s no page at this address. Check it for typos.</p>
    <a href="/">Go to the home page</a>
  </main>
</body>
</html>
