name: HealthComp
options:
  bundleIdPrefix: com.narenyenuganti
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Staging: release
  Release: release

configFiles:
  Debug: Configuration/Development.xcconfig
  Staging: Configuration/Staging.xcconfig
  Release: Configuration/Production.xcconfig

packages:
  CompetitionCore:
    path: Modules/CompetitionCore
  ComposableArchitecture:
    url: https://github.com/pointfreeco/swift-composable-architecture
    from: "1.17.0"
  Supabase:
    url: https://github.com/supabase/supabase-swift
    exactVersion: 2.49.0

targets:
  HealthComp:
    type: application
    platform: iOS
    sources:
      - path: HealthComp
    info:
      path: HealthComp/Resources/Info.plist
      properties:
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - healthkit
        NSHealthShareUsageDescription: "HealthComp reads your activity data to score competitions with friends."
        SUPABASE_URL: "$(SUPABASE_URL)"
        SUPABASE_PUBLISHABLE_KEY: "$(SUPABASE_PUBLISHABLE_KEY)"
        CFBundleURLTypes:
          - CFBundleURLName: com.narenyenuganti.HealthComp.competition
            CFBundleURLSchemes:
              - healthcomp
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: HealthComp/Resources/HealthComp.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
    dependencies:
      - package: CompetitionCore
        product: CompetitionCore
      - package: ComposableArchitecture
      - package: Supabase
        product: Supabase

  HealthCompTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HealthCompTests
    dependencies:
      - target: HealthComp
      - package: CompetitionCore
        product: CompetitionCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"

  HealthCompUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: HealthCompUITests
    dependencies:
      - target: HealthComp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"

schemes:
  HealthComp:
    build:
      targets:
        HealthComp: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: HealthCompTests
          parallelizable: true
        - name: HealthCompUITests
          parallelizable: false
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  HealthComp Staging:
    build:
      targets:
        HealthComp: all
    run:
      config: Staging
    test:
      config: Staging
      targets:
        - name: HealthCompTests
          parallelizable: true
        - name: HealthCompUITests
          parallelizable: false
    profile:
      config: Staging
    analyze:
      config: Staging
    archive:
      config: Staging
