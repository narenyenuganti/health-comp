name: HealthComp
options:
  bundleIdPrefix: com.narenyenuganti
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Staging: release
  Release: release

configFiles:
  Debug: Configuration/Development.xcconfig
  Staging: Configuration/Staging.xcconfig
  Release: Configuration/Production.xcconfig

packages:
  CompetitionCore:
    path: Modules/CompetitionCore
  ComposableArchitecture:
    url: https://github.com/pointfreeco/swift-composable-architecture
    from: "1.17.0"
  Supabase:
    url: https://github.com/supabase/supabase-swift
    exactVersion: 2.55.1

targets:
  HealthComp:
    type: application
    platform: iOS
    sources:
      - path: HealthComp
    info:
      path: HealthComp/Resources/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen:
          UIColorName: LaunchGround
          UIImageName: LaunchMark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - healthkit
        NSHealthShareUsageDescription: "HealthComp reads your Activity data to score matches with friends."
        # Upload validation requires both purpose keys; authorization remains read-only.
        NSHealthUpdateUsageDescription: "HealthComp uses read-only Health access for Activity matches and does not save or change Health data."
        NSPhotoLibraryAddUsageDescription: "HealthComp saves your match result image to Photos when you choose Save Image."
        NSUserActivityTypes:
          - INSendMessageIntent
        NSSupportsLiveActivities: true
        SUPABASE_URL: "$(SUPABASE_URL)"
        SUPABASE_PUBLISHABLE_KEY: "$(SUPABASE_PUBLISHABLE_KEY)"
        HEALTHCOMP_APNS_ENVIRONMENT: "$(HEALTHCOMP_APNS_ENVIRONMENT)"
        HEALTHCOMP_APP_GROUP: "$(HEALTHCOMP_APP_GROUP)"
        HEALTHCOMP_INVITE_HOST: "$(HEALTHCOMP_INVITE_HOST)"
        HEALTHCOMP_ALLOW_CUSTOM_INVITE_SCHEME: "$(HEALTHCOMP_ALLOW_CUSTOM_INVITE_SCHEME)"
        CFBundleURLTypes:
          - CFBundleURLName: com.narenyenuganti.HealthComp.competition
            CFBundleURLSchemes:
              - healthcomp
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: HealthComp/Resources/HealthComp.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
      configs:
        Staging:
          PRODUCT_BUNDLE_IDENTIFIER: com.narenyenuganti.HealthComp.staging
          INFOPLIST_FILE: Configuration/Staging-Info.plist
    dependencies:
      - package: CompetitionCore
        product: CompetitionCore
      - package: ComposableArchitecture
      - package: Supabase
        product: Supabase
      - target: HealthCompWidgets
      - target: HealthCompWatch

  # Reads the app's snapshot file and Live Activity content only: no
  # network, HealthKit, TCA or CompetitionCore. Shared sources must stay extension-safe.
  HealthCompWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: HealthCompWidgets
      - path: HealthComp/Features/Widgets/CompetitionWidgetSnapshot.swift
      - path: HealthComp/Features/Competition/CompetitionDayBar.swift
      - path: HealthComp/Features/Competition/CompetitionDateFormatting.swift
      - path: HealthComp/Features/Competition/CompetitionLeadText.swift
      - path: HealthComp/LiveActivity
      - path: HealthComp/App/Theme.swift
      - path: HealthComp/App/Motion.swift
    info:
      path: HealthCompWidgets/Info.plist
      properties:
        CFBundleDisplayName: HealthComp
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        HEALTHCOMP_APP_GROUP: "$(HEALTHCOMP_APP_GROUP)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: HealthCompWidgets/HealthCompWidgets.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.narenyenuganti.HealthComp.widgets
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
      configs:
        Staging:
          PRODUCT_BUNDLE_IDENTIFIER: com.narenyenuganti.HealthComp.staging.widgets

  # No network, HealthKit, TCA or CompetitionCore: the iPhone sends the widget
  # snapshot over WatchConnectivity and this app stores it for the complication.
  HealthCompWatch:
    type: application
    platform: watchOS
    sources:
      - path: HealthCompWatch
      - path: HealthComp/Features/Widgets/CompetitionWidgetSnapshot.swift
      - path: HealthComp/Features/Widgets/CompetitionWatchBoard.swift
      - path: HealthComp/Features/Competition/CompetitionDayBar.swift
      - path: HealthComp/Features/Competition/CompetitionDateFormatting.swift
      - path: HealthComp/Features/Competition/CompetitionLeadText.swift
      - path: HealthComp/App/Theme.swift
      - path: HealthComp/App/Motion.swift
    info:
      path: HealthCompWatch/Info.plist
      properties:
        CFBundleDisplayName: HealthComp
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        WKApplication: true
        WKCompanionAppBundleIdentifier: "$(HEALTHCOMP_IOS_BUNDLE_ID)"
        WKRunsIndependentlyOfCompanionApp: false
        HEALTHCOMP_APP_GROUP: "$(HEALTHCOMP_APP_GROUP)"
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: HealthCompWatch/HealthCompWatch.entitlements
        HEALTHCOMP_IOS_BUNDLE_ID: com.narenyenuganti.HealthComp
        PRODUCT_BUNDLE_IDENTIFIER: com.narenyenuganti.HealthComp.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        SWIFT_VERSION: "5.9"
      configs:
        Staging:
          HEALTHCOMP_IOS_BUNDLE_ID: com.narenyenuganti.HealthComp.staging
          PRODUCT_BUNDLE_IDENTIFIER: com.narenyenuganti.HealthComp.staging.watchkitapp
    dependencies:
      - target: HealthCompWatchWidgets

  HealthCompWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: HealthCompWatchWidgets
      - path: HealthComp/Features/Widgets/CompetitionWidgetSnapshot.swift
      - path: HealthComp/Features/Widgets/CompetitionWatchBoard.swift
      - path: HealthComp/Features/Competition/CompetitionDayBar.swift
      - path: HealthComp/Features/Competition/CompetitionDateFormatting.swift
      - path: HealthComp/App/Theme.swift
      - path: HealthComp/App/Motion.swift
    info:
      path: HealthCompWatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: HealthComp
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        HEALTHCOMP_APP_GROUP: "$(HEALTHCOMP_APP_GROUP)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: HealthCompWatch/HealthCompWatch.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.narenyenuganti.HealthComp.watchkitapp.widgets
        TARGETED_DEVICE_FAMILY: "4"
        SWIFT_VERSION: "5.9"
      configs:
        Staging:
          PRODUCT_BUNDLE_IDENTIFIER: com.narenyenuganti.HealthComp.staging.watchkitapp.widgets

  HealthCompWatchUITests:
    type: bundle.ui-testing
    platform: watchOS
    sources:
      - path: HealthCompWatchUITests
    dependencies:
      - target: HealthCompWatch
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"

  HealthCompTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HealthCompTests
    dependencies:
      - target: HealthComp
      - package: CompetitionCore
        product: CompetitionCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"

  # Staging is release-style: do not compile DEBUG-only Test Lab fixtures here.
  HealthCompStagingTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HealthCompTests/CompetitionCustomSchemeTests.swift
      - path: HealthCompTests/SupabaseAppleWebDeletionTransportTests.swift
      - path: HealthCompTests/SupabaseConfigurationTests.swift
      - path: HealthCompTests/StagingScoringResponseCaptureTests.swift
      - path: HealthCompTests/StagingActivityObservationTests.swift
    dependencies:
      - target: HealthComp
      - package: CompetitionCore
        product: CompetitionCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"

  HealthCompUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: HealthCompUITests
    dependencies:
      - target: HealthComp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"

schemes:
  HealthCompWatch:
    build:
      targets:
        HealthCompWatch: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: HealthCompWatchUITests
          parallelizable: false

  HealthComp:
    build:
      targets:
        HealthComp: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: HealthCompTests
          parallelizable: true
        - name: HealthCompUITests
          parallelizable: false
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  HealthComp Staging:
    build:
      targets:
        HealthComp: all
    run:
      config: Staging
    test:
      config: Staging
      targets:
        - name: HealthCompStagingTests
          parallelizable: false
    profile:
      config: Staging
    analyze:
      config: Staging
    archive:
      config: Staging
