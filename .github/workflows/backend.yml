name: Backend CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Supabase and Deno
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.5
          cache: false

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.113.0

      - name: Verify static backend boundaries
        run: |
          set -euo pipefail
          bash scripts/test-verify-no-secrets.sh
          sh scripts/test-verify-invitation-functions.sh
          sh scripts/test-staging-adversarial-sql.sh
          bash scripts/verify-no-secrets.sh
          bash scripts/verify-supabase-layout.sh
          deno fmt --config supabase/functions/deno.json --check supabase/functions
          deno lint --config supabase/functions/deno.json supabase/functions
          git diff --check

      - name: Verify migrations, policies, and Edge Functions
        run: |
          set -euo pipefail
          schema_diff="$(mktemp "$RUNNER_TEMP/healthcomp-schema-diff.XXXXXX")"

          cleanup() {
            supabase stop --no-backup >/dev/null 2>&1 || true
            rm -f -- "$schema_diff"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          trap 'exit 129' HUP

          supabase start
          supabase db reset
          supabase test db

          database_containers="$(
            docker ps \
              --filter 'label=com.supabase.cli.project=health-comp' \
              --filter 'name=supabase_db_' \
              --format '{{.ID}}'
          )"
          database_container_count="$(
            printf '%s\n' "$database_containers" | sed '/^$/d' | wc -l | tr -d ' '
          )"
          if [[ "$database_container_count" -ne 1 ]]; then
            echo "Expected exactly one HealthComp local database container." >&2
            exit 1
          fi
          docker exec -i "$database_containers" \
            psql \
              --no-psqlrc \
              --quiet \
              --tuples-only \
              --no-align \
              --set=ON_ERROR_STOP=1 \
              --username=postgres \
              --dbname=postgres \
            < scripts/staging-adversarial-rollback.sql

          deno test \
            --config supabase/functions/deno.json \
            --allow-env \
            --allow-net \
            --allow-read \
            supabase/functions
          bash scripts/verify-invitation-functions.sh
          supabase db lint --local --level warning --fail-on warning
          supabase db diff --local >"$schema_diff"

          if [[ -s "$schema_diff" ]]; then
            echo "Local database differs from the checked-in migrations." >&2
            exit 1
          fi

          git diff --exit-code
