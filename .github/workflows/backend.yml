name: Backend CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Supabase and Deno
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      HEALTHCOMP_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      HEALTHCOMP_TEST_FUNCTIONS_URL: http://127.0.0.1:54321/functions/v1

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.5
          cache: false

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.113.0

      - name: Verify static backend boundaries
        run: |
          set -euo pipefail
          bash scripts/test-verify-no-secrets.sh
          python3 -B -m unittest scripts.tests.test_verify_support_email
          for script in scripts/*.sh; do bash -n "$script"; done
          sh scripts/test-staging-adversarial-sql.sh
          sh scripts/test-verify-app-attest-dependency-graph.sh
          bash scripts/verify-no-secrets.sh
          bash scripts/verify-supabase-layout.sh
          # Pages deploys web/ and functions/ on every push to main: universal
          # links, their rewrites and private-link headers must survive edits.
          python3 - <<'PY'
          import json
          detail, = json.load(open("web/.well-known/apple-app-site-association"))["applinks"]["details"]
          assert sorted(detail["appIDs"]) == [
              "23LUYD78QK.com.narenyenuganti.HealthComp",
              "23LUYD78QK.com.narenyenuganti.HealthComp.staging",
          ], "association app IDs changed"
          assert [c["/"] for c in detail["components"]] == ["/invite/*", "/c/*"], "association paths changed"
          PY
          grep -qxF '/invite/*  /invite  200' web/_redirects
          grep -qxF '/c/*  /challenge  200' web/_redirects
          [[ "$(grep -cxF '  Cache-Control: no-store' web/_headers)" == 2 ]]
          [[ "$(grep -cxF '  Referrer-Policy: no-referrer' web/_headers)" == 2 ]]
          [[ "$(grep -cxF '  X-Robots-Tag: noindex' web/_headers)" == 2 ]]
          deno eval '
            const { onRequestPost } = await import("./functions/api/waitlist.js");
            const body = new FormData();
            body.set("email", "not-an-email");
            const response = await onRequestPost({ request: new Request("http://localhost/api/waitlist", { method: "POST", body }), env: {} });
            if (response.status !== 400) throw new Error(`waitlist answered ${response.status} to a bad email`);
          '
          deno fmt --config supabase/functions/deno.json --check \
            scripts/tests/invitation-page.test.ts \
            supabase/functions \
            supabase/tests/edge-runtime
          deno lint --config supabase/functions/deno.json supabase/functions scripts/tests/invitation-page.test.ts
          git diff --check

      - name: Verify the released-API snapshot
        env:
          RETIRES_RELEASED_API: ${{ contains(github.event.pull_request.labels.*.name, 'retire-released-api') }}
        run: |
          set -euo pipefail
          snapshot=supabase/tests/900_released_api.test.sql
          version="$(sed -nE 's/^MARKETING_VERSION = (.+)$/\1/p' Configuration/Base.xcconfig)"
          build="$(sed -nE 's/^CURRENT_PROJECT_VERSION = (.+)$/\1/p' Configuration/Base.xcconfig)"
          if ! head -n 1 "$snapshot" | grep -qF "for build $version ($build)."; then
            echo "Base.xcconfig is $version ($build) but $snapshot was saved for another build; run scripts/save-released-api.sh." >&2
            exit 1
          fi
          # Deleting a released function's line drops the guard for installed builds.
          if [[ "$GITHUB_EVENT_NAME" == pull_request && "$RETIRES_RELEASED_API" != true ]]; then
            git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF"
            if git diff FETCH_HEAD -- "$snapshot" | grep -qE '^-    \('; then
              echo "This pull request removes released functions from $snapshot. Keep them, or label the pull request retire-released-api when no installed build calls them." >&2
              exit 1
            fi
          fi

      - name: Verify migrations, policies, and Edge Functions
        run: |
          set -euo pipefail
          schema_diff="$(mktemp "$RUNNER_TEMP/healthcomp-schema-diff.XXXXXX")"

          cleanup() {
            supabase stop --no-backup >/dev/null 2>&1 || true
            rm -f -- "$schema_diff"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          trap 'exit 129' HUP

          supabase start
          # Rehearse the actual forward migration with an existing synthetic
          # legacy token before qualifying the full current schema below.
          supabase db reset --local --version 20260822001000
          bash scripts/test-deletion-client-migration.sh
          supabase db reset --local --version 20260906001300
          bash scripts/test-deleted-profile-history-migration.sh
          supabase db reset --local --version 20260913001400
          bash scripts/test-retired-installation-token-migration.sh
          supabase db reset --local --version 20261002001700
          bash scripts/test-invitation-recipient-migration.sh
          supabase db reset
          supabase test db

          database_containers="$(
            docker ps \
              --filter 'label=com.supabase.cli.project=health-comp' \
              --filter 'name=supabase_db_' \
              --format '{{.ID}}'
          )"
          database_container_count="$(
            printf '%s\n' "$database_containers" | sed '/^$/d' | wc -l | tr -d ' '
          )"
          if [[ "$database_container_count" -ne 1 ]]; then
            echo "Expected exactly one HealthComp local database container." >&2
            exit 1
          fi
          docker exec -i "$database_containers" \
            psql \
              --no-psqlrc \
              --quiet \
              --tuples-only \
              --no-align \
              --set=ON_ERROR_STOP=1 \
              --username=postgres \
              --dbname=postgres \
            < scripts/staging-adversarial-rollback.sql

          deno test \
            --config supabase/functions/deno.json \
            --allow-env \
            --allow-net \
            --allow-read \
            supabase/functions scripts/tests/invitation-page.test.ts
          sh scripts/test-app-attest-edge-runtime.sh
          bash scripts/verify-invitation-functions.sh
          supabase db lint --local --level warning --fail-on warning
          # The empty-file guard requires raw SQL, including in agent environments.
          supabase db diff --local --agent no >"$schema_diff"

          if [[ -s "$schema_diff" ]]; then
            echo "Local database differs from the checked-in migrations." >&2
            exit 1
          fi

          git diff --exit-code
