name: Backend CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Supabase and Deno
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.5
          cache: false

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.113.0

      - name: Verify static backend boundaries
        run: |
          set -euo pipefail
          bash scripts/test-verify-no-secrets.sh
          bash scripts/test-backup-runbook.sh
          bash scripts/test-backup-runbook-checks.sh
          bash -n scripts/emit-recovery-history-test-sql.sh
          bash -n scripts/test-recovery-history-wrapper.sh
          sh scripts/test-verify-invitation-functions.sh
          sh scripts/test-staging-adversarial-sql.sh
          sh scripts/test-verify-app-attest-dependency-graph.sh
          sh -n scripts/verify-app-attest-dependency-graph.sh
          sh -n scripts/test-app-attest-edge-runtime.sh
          bash scripts/verify-no-secrets.sh
          bash scripts/verify-supabase-layout.sh
          deno fmt --config supabase/functions/deno.json --check \
            supabase/functions \
            supabase/tests/app-attest-hosted-regression.deno.json \
            supabase/tests/app-attest-hosted-regression.deno.lock \
            supabase/tests/edge-runtime
          deno lint --config supabase/functions/deno.json supabase/functions
          git diff --check

      - name: Verify migrations, policies, and Edge Functions
        run: |
          set -euo pipefail
          schema_diff="$(mktemp "$RUNNER_TEMP/healthcomp-schema-diff.XXXXXX")"

          cleanup() {
            supabase stop --no-backup >/dev/null 2>&1 || true
            rm -f -- "$schema_diff"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          trap 'exit 129' HUP

          supabase start
          supabase db reset
          supabase test db

          database_containers="$(
            docker ps \
              --filter 'label=com.supabase.cli.project=health-comp' \
              --filter 'name=supabase_db_' \
              --format '{{.ID}}'
          )"
          database_container_count="$(
            printf '%s\n' "$database_containers" | sed '/^$/d' | wc -l | tr -d ' '
          )"
          if [[ "$database_container_count" -ne 1 ]]; then
            echo "Expected exactly one HealthComp local database container." >&2
            exit 1
          fi
          docker exec -i "$database_containers" \
            psql \
              --no-psqlrc \
              --quiet \
              --tuples-only \
              --no-align \
              --set=ON_ERROR_STOP=1 \
              --username=postgres \
              --dbname=postgres \
            < scripts/staging-adversarial-rollback.sql

          # Separate empty, disposable fixture database; never a linked project.
          # createdb fails if the exact name already exists; do not reuse it.
          docker exec "$database_containers" createdb \
            --host=/var/run/postgresql --username=postgres --template=template0 \
            healthcomp_recovery_fixture
          bash scripts/emit-recovery-history-test-sql.sh | \
            docker exec -i "$database_containers" psql \
              --no-psqlrc --no-password --quiet --tuples-only --no-align \
              --host=/var/run/postgresql --username=postgres \
              --dbname=healthcomp_recovery_fixture --set=ON_ERROR_STOP=on
          docker exec "$database_containers" mkdir /tmp/healthcomp-recovery-checks
          for recovery_file in recovery-history-integrity.sql \
            recovery-history-integrity-query.sql test-recovery-history-wrapper.sh; do
            docker cp "scripts/$recovery_file" \
              "$database_containers:/tmp/healthcomp-recovery-checks/$recovery_file"
          done
          docker exec \
            --env PGHOST=/var/run/postgresql --env PGUSER=postgres \
            --env PGDATABASE=healthcomp_recovery_fixture \
            "$database_containers" bash \
              /tmp/healthcomp-recovery-checks/test-recovery-history-wrapper.sh
          docker exec "$database_containers" dropdb \
            --host=/var/run/postgresql --username=postgres healthcomp_recovery_fixture

          # Actual query + wrapper against the real, fully migrated CI schema.
          # This is compatibility evidence, not a populated hosted restore.
          docker exec "$database_containers" psql \
            --no-psqlrc --no-password --quiet --tuples-only --no-align \
            --host=/var/run/postgresql --username=postgres --dbname=postgres \
            --set=ON_ERROR_STOP=on \
            --file=/tmp/healthcomp-recovery-checks/recovery-history-integrity.sql

          deno test \
            --config supabase/functions/deno.json \
            --allow-env \
            --allow-net \
            --allow-read \
            supabase/functions
          deno test \
            --config supabase/tests/app-attest-hosted-regression.deno.json \
            --allow-read \
            supabase/functions/_shared/app-attest_hosted_regression_test.ts
          sh scripts/test-app-attest-edge-runtime.sh
          bash scripts/verify-invitation-functions.sh
          supabase db lint --local --level warning --fail-on warning
          supabase db diff --local >"$schema_diff"

          if [[ -s "$schema_diff" ]]; then
            echo "Local database differs from the checked-in migrations." >&2
            exit 1
          fi

          git diff --exit-code
