name: iOS CI

on:
  pull_request:
    # iOS CI reads none of these; Backend CI still covers them.
    paths-ignore:
      - "docs/**"
      - "web/**"
      - "supabase/**"
      - "**.md"
  # Squash merges land code the PR run already passed, so main runs nightly
  # (catching merges after main moved) and on demand for exact-main evidence.
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
  HOMEBREW_NO_AUTO_UPDATE: "1"
  SUPABASE_URL: https://ci-fixture.supabase.co
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci-fixture

# Three parallel jobs. The Debug and Staging device builds follow their
# Simulator builds to reuse that job's swift-syntax macro plugins; the core
# job verifies the shared Xcode version for all three.
jobs:
  core:
    name: Core checks and Release device build
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Restore Swift package checkouts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/HealthComp-DerivedData/SourcePackages
          key: spm-xcode16.4-${{ hashFiles('HealthComp.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-xcode16.4-

      - name: Verify Xcode and install XcodeGen
        run: |
          set -euo pipefail
          xcode_version="$(xcodebuild -version)"
          printf '%s\n' "$xcode_version"
          if [[ "${xcode_version%%$'\n'*}" != "Xcode 16.4" ]]; then
            printf 'Expected Xcode 16.4, got: %s\n' "${xcode_version%%$'\n'*}" >&2
            exit 1
          fi
          brew install xcodegen ripgrep
          xcodegen_version="$(xcodegen --version)"
          if [[ "$xcodegen_version" != "Version: 2.46.0" ]]; then
            printf 'Expected XcodeGen 2.46.0, got: %s\n' "$xcodegen_version" >&2
            exit 1
          fi

      - name: Verify deterministic project generation
        run: |
          set -euo pipefail
          tracked_hash="$(shasum -a 256 HealthComp.xcodeproj/project.pbxproj | cut -d ' ' -f 1)"
          xcodegen generate
          first_hash="$(shasum -a 256 HealthComp.xcodeproj/project.pbxproj | cut -d ' ' -f 1)"
          xcodegen generate
          second_hash="$(shasum -a 256 HealthComp.xcodeproj/project.pbxproj | cut -d ' ' -f 1)"

          if [[ "$tracked_hash" != "$first_hash" ]]; then
            printf 'Generated project differs from the tracked project.\n' >&2
            exit 1
          fi
          if [[ "$first_hash" != "$second_hash" ]]; then
            printf 'XcodeGen output is not deterministic.\n' >&2
            exit 1
          fi
          git diff --exit-code -- HealthComp.xcodeproj

      - name: Verify staging browser boundaries
        run: |
          set -euo pipefail
          bash scripts/test-staging-apple-web-build-contract.sh
          bash scripts/test-staging-apple-web-contract.sh
          bash scripts/test-apple-web-session-lifetime.sh
          bash scripts/test-apple-web-deletion-operation.sh

      - name: Verify app-owned privacy manifest
        run: |
          set -euo pipefail
          bash scripts/verify-app-privacy-manifest.sh
          bash scripts/test-app-privacy-manifest.sh

      - name: Verify staging-only diagnostic output
        run: |
          set -euo pipefail
          bash scripts/test-healthkit-delivery-diagnostics.sh
          bash scripts/test-competition-refresh-diagnostics.sh
          bash scripts/test-staging-scoring-response-capture.sh

      - name: Test CompetitionCore in Debug and Release
        run: |
          set -euo pipefail
          swift test \
            --package-path Modules/CompetitionCore \
            --scratch-path "$RUNNER_TEMP/CompetitionCore-Debug"
          swift test \
            --configuration release \
            --package-path Modules/CompetitionCore \
            --scratch-path "$RUNNER_TEMP/CompetitionCore-Release"

      - name: Build unsigned Release device configuration
        run: |
          set -euo pipefail
          xcodebuild build \
            -project HealthComp.xcodeproj \
            -scheme HealthComp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/HealthComp-DerivedData" \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            -xcconfig Configuration/CI.xcconfig \
            COMPILER_INDEX_STORE_ENABLE=NO \
            SUPABASE_URL="$SUPABASE_URL" \
            SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
          bash scripts/verify-app-privacy-manifest.sh --app-bundle \
            "$RUNNER_TEMP/HealthComp-DerivedData/Build/Products/Release-iphoneos/HealthComp.app"

      - name: Verify source tree remains clean
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code
          [[ -z "$(git status --porcelain --untracked-files=all)" ]]

  ios:
    name: Debug tests and device build
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Restore Swift package checkouts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/HealthComp-DerivedData/SourcePackages
          key: spm-xcode16.4-${{ hashFiles('HealthComp.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-xcode16.4-

      - name: Prepare pinned iOS Simulator
        timeout-minutes: 10
        run: |
          set -euo pipefail
          xcrun simctl list runtimes
          xcrun simctl list devices available
          # Own one exact device instead of relying on the runner's device catalog.
          simulator_id="$(xcrun simctl create \
            'HealthComp CI' \
            com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro \
            com.apple.CoreSimulator.SimRuntime.iOS-18-5)"
          printf 'HEALTHCOMP_CI_SIMULATOR_ID=%s\n' "$simulator_id" >> "$GITHUB_ENV"
          # First boot spends about a minute migrating data; let it overlap
          # the build. The wait step below confirms it finished.
          nohup xcrun simctl bootstatus "$simulator_id" -b \
            </dev/null >"$RUNNER_TEMP/simulator-boot.log" 2>&1 &

      - name: Build iOS application logic tests
        run: |
          set -euo pipefail
          xcodebuild build-for-testing \
            -project HealthComp.xcodeproj \
            -scheme HealthComp \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$HEALTHCOMP_CI_SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/HealthComp-DerivedData" \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            -xcconfig Configuration/CI.xcconfig \
            COMPILER_INDEX_STORE_ENABLE=NO \
            SUPABASE_URL="$SUPABASE_URL" \
            SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      - name: Wait for pinned iOS Simulator
        timeout-minutes: 10
        run: xcrun simctl bootstatus "$HEALTHCOMP_CI_SIMULATOR_ID" -b

      - name: Test iOS application logic, invitation copy, and privacy disclosures
        run: |
          set -euo pipefail
          xcodebuild test-without-building \
            -project HealthComp.xcodeproj \
            -scheme HealthComp \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$HEALTHCOMP_CI_SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/HealthComp-DerivedData" \
            -only-testing:HealthCompTests \
            -only-testing:HealthCompUITests/MultiUserCompetitionUITests/testCopyCustomSchemeInvitationIncludesTheCompleteLink \
            -only-testing:HealthCompUITests/MultiUserCompetitionUITests/testCopyCustomSchemeRematchIncludesTheCompleteLink \
            -only-testing:HealthCompUITests/MultiUserCompetitionUITests/testAccountEditingAndPrivacyBoundariesRemainAccessible \
            -only-testing:HealthCompUITests/MultiUserCompetitionUITests/testAccountDeletionFailureRemainsVisibleOnDeletionPage \
            -only-testing:HealthCompUITests/MultiUserCompetitionUITests/testRemoteDayDrawerShowsBothAcceptedScoresWithoutRawHealthSnapshots \
            -only-testing:HealthCompUITests/MultiUserCompetitionUITests/testRemoteCompetitionAppearanceAndTypeSizeMatrix \
            -only-testing:HealthCompUITests/MultiUserCompetitionUITests/testCreateRemoteUpdatesHistoryAnonymizationRematchAndArchive \
            -only-testing:HealthCompUITests/MultiUserCompetitionUITests/testWelcomeDisclosesSharedDerivedActivity \
            -only-testing:HealthCompUITests/MultiUserCompetitionUITests/testHealthOnboardingDisclosesSharedDerivedActivity \
            -only-testing:HealthCompUITests/MultiUserCompetitionUITests/testRemoteInvitationDisclosesSharedDerivedActivity \
            -parallel-testing-enabled NO \
            -maximum-concurrent-test-simulator-destinations 1 \
            -maximum-parallel-testing-workers 1 \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipMacroValidation \
            -skipPackagePluginValidation

      - name: Build unsigned Debug device configuration
        run: |
          set -euo pipefail
          xcodebuild build \
            -project HealthComp.xcodeproj \
            -scheme HealthComp \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/HealthComp-DerivedData" \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            -xcconfig Configuration/CI.xcconfig \
            COMPILER_INDEX_STORE_ENABLE=NO \
            SUPABASE_URL="$SUPABASE_URL" \
            SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
          bash scripts/verify-app-privacy-manifest.sh --app-bundle \
            "$RUNNER_TEMP/HealthComp-DerivedData/Build/Products/Debug-iphoneos/HealthComp.app"

      - name: Verify source tree remains clean
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code
          [[ -z "$(git status --porcelain --untracked-files=all)" ]]

  staging:
    name: Staging tests and device build
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Restore Swift package checkouts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/HealthComp-DerivedData/SourcePackages
          key: spm-xcode16.4-${{ hashFiles('HealthComp.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-xcode16.4-

      - name: Prepare pinned iOS Simulator
        timeout-minutes: 10
        run: |
          set -euo pipefail
          xcrun simctl list runtimes
          xcrun simctl list devices available
          # Own one exact device instead of relying on the runner's device catalog.
          simulator_id="$(xcrun simctl create \
            'HealthComp CI' \
            com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro \
            com.apple.CoreSimulator.SimRuntime.iOS-18-5)"
          printf 'HEALTHCOMP_CI_SIMULATOR_ID=%s\n' "$simulator_id" >> "$GITHUB_ENV"
          # First boot spends about a minute migrating data; let it overlap
          # the build. The wait step below confirms it finished.
          nohup xcrun simctl bootstatus "$simulator_id" -b \
            </dev/null >"$RUNNER_TEMP/simulator-boot.log" 2>&1 &

      - name: Build release-style Staging browser tests
        run: |
          set -euo pipefail
          # Dedicated tests avoid importing DEBUG-only Test Lab fixtures.
          # CI.xcconfig's Simulator testability permits @testable imports
          # without enabling DEBUG.
          xcodebuild build-for-testing \
            -project HealthComp.xcodeproj \
            -scheme 'HealthComp Staging' \
            -configuration Staging \
            -destination "platform=iOS Simulator,id=$HEALTHCOMP_CI_SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/HealthComp-DerivedData" \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            -xcconfig Configuration/CI.xcconfig \
            COMPILER_INDEX_STORE_ENABLE=NO \
            SUPABASE_URL="$SUPABASE_URL" \
            SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      - name: Wait for pinned iOS Simulator
        timeout-minutes: 10
        run: xcrun simctl bootstatus "$HEALTHCOMP_CI_SIMULATOR_ID" -b

      - name: Test release-style Staging browser configuration
        run: |
          set -euo pipefail
          xcodebuild test-without-building \
            -project HealthComp.xcodeproj \
            -scheme 'HealthComp Staging' \
            -configuration Staging \
            -destination "platform=iOS Simulator,id=$HEALTHCOMP_CI_SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/HealthComp-DerivedData" \
            -only-testing:HealthCompStagingTests \
            -parallel-testing-enabled NO \
            -maximum-concurrent-test-simulator-destinations 1 \
            -maximum-parallel-testing-workers 1 \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipMacroValidation \
            -skipPackagePluginValidation

      - name: Build unsigned Staging device configuration
        run: |
          set -euo pipefail
          xcodebuild build \
            -project HealthComp.xcodeproj \
            -scheme HealthComp \
            -configuration Staging \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/HealthComp-DerivedData" \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            -xcconfig Configuration/CI.xcconfig \
            COMPILER_INDEX_STORE_ENABLE=NO \
            SUPABASE_URL="$SUPABASE_URL" \
            SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
          bash scripts/verify-app-privacy-manifest.sh --app-bundle \
            "$RUNNER_TEMP/HealthComp-DerivedData/Build/Products/Staging-iphoneos/HealthComp.app"

      - name: Verify source tree remains clean
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code
          [[ -z "$(git status --porcelain --untracked-files=all)" ]]
