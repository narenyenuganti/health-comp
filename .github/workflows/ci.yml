name: iOS CI

on:
  pull_request:
    # iOS CI reads none of the excluded paths; Backend CI still covers them.
    # Later patterns win: CompetitionCore tests read the shared scoring
    # fixtures under supabase/tests/fixtures.
    paths:
      - "**"
      - "!docs/**"
      - "!web/**"
      - "!functions/**"
      - "!supabase/**"
      - "!README.md"
      - "supabase/tests/fixtures/**"
  # Pull requests run a short set: core checks, the Release device build, the
  # unit tests and one UI test per main flow. The nightly run on main and
  # manual runs add every other listed UI test, the Staging tests, and the
  # Staging and Debug device builds. Before a release, run the full set with:
  #   gh workflow run "iOS CI" --ref <branch>
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  # Newer pull request pushes replace older runs; runs on main queue instead.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
  HOMEBREW_NO_AUTO_UPDATE: "1"
  SUPABASE_URL: https://ci-fixture.supabase.co
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci-fixture

# Pull requests run two jobs (core and Debug tests), so two pull requests fit
# in the five concurrent macOS jobs. Nightly and manual runs add the Staging
# job, whose device build follows its Simulator build to reuse that job's
# swift-syntax macro plugins. The core job verifies the shared Xcode version.
jobs:
  core:
    name: Core checks and device builds
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Restore Swift package checkouts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/HealthComp-DerivedData/SourcePackages
          key: spm-xcode16.4-${{ hashFiles('HealthComp.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-xcode16.4-

      - name: Verify Xcode and install XcodeGen
        run: |
          set -euo pipefail
          xcode_version="$(xcodebuild -version)"
          printf '%s\n' "$xcode_version"
          if [[ "${xcode_version%%$'\n'*}" != "Xcode 16.4" ]]; then
            printf 'Expected Xcode 16.4, got: %s\n' "${xcode_version%%$'\n'*}" >&2
            exit 1
          fi
          brew install ripgrep
          # Pinned by hash: an unpinned formula would fail every PR the day
          # the runner image ships a newer XcodeGen.
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          export PATH="$RUNNER_TEMP/xcodegen/bin:$PATH"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
          xcodegen_version="$(xcodegen --version)"
          if [[ "$xcodegen_version" != "Version: 2.46.0" ]]; then
            printf 'Expected XcodeGen 2.46.0, got: %s\n' "$xcodegen_version" >&2
            exit 1
          fi

      - name: Verify deterministic project generation
        run: |
          set -euo pipefail
          tracked_hash="$(shasum -a 256 HealthComp.xcodeproj/project.pbxproj | cut -d ' ' -f 1)"
          xcodegen generate
          first_hash="$(shasum -a 256 HealthComp.xcodeproj/project.pbxproj | cut -d ' ' -f 1)"
          xcodegen generate
          second_hash="$(shasum -a 256 HealthComp.xcodeproj/project.pbxproj | cut -d ' ' -f 1)"

          if [[ "$tracked_hash" != "$first_hash" ]]; then
            printf 'Generated project differs from the tracked project.\n' >&2
            exit 1
          fi
          if [[ "$first_hash" != "$second_hash" ]]; then
            printf 'XcodeGen output is not deterministic.\n' >&2
            exit 1
          fi
          git diff --exit-code -- HealthComp.xcodeproj

      - name: Verify staging browser boundaries
        run: |
          set -euo pipefail
          bash scripts/test-staging-apple-web-build-contract.sh
          bash scripts/test-staging-apple-web-contract.sh
          bash scripts/test-apple-web-session-lifetime.sh
          bash scripts/test-apple-web-deletion-operation.sh

      - name: Verify app-owned privacy manifest
        run: |
          set -euo pipefail
          bash scripts/verify-app-privacy-manifest.sh
          bash scripts/test-app-privacy-manifest.sh
          bash scripts/test-verify-watch-embed.sh

      - name: Verify staging-only diagnostic output
        run: |
          set -euo pipefail
          bash scripts/test-healthkit-delivery-diagnostics.sh
          bash scripts/test-competition-refresh-diagnostics.sh
          bash scripts/test-staging-scoring-response-capture.sh

      - name: Verify local-time display formatting
        run: bash scripts/test-competition-local-date-formatting.sh

      - name: Verify Motion tokens
        run: bash scripts/verify-motion-tokens.sh

      - name: Test CompetitionCore in Debug and Release
        run: |
          set -euo pipefail
          swift test \
            --package-path Modules/CompetitionCore \
            --scratch-path "$RUNNER_TEMP/CompetitionCore-Debug"
          swift test \
            --configuration release \
            --package-path Modules/CompetitionCore \
            --scratch-path "$RUNNER_TEMP/CompetitionCore-Release"

      - name: Build unsigned Release device configuration
        run: |
          set -euo pipefail
          xcodebuild build \
            -project HealthComp.xcodeproj \
            -scheme HealthComp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/HealthComp-DerivedData" \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            -xcconfig Configuration/CI.xcconfig \
            COMPILER_INDEX_STORE_ENABLE=NO \
            SUPABASE_URL="$SUPABASE_URL" \
            SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
          bash scripts/verify-app-privacy-manifest.sh --app-bundle \
            "$RUNNER_TEMP/HealthComp-DerivedData/Build/Products/Release-iphoneos/HealthComp.app"
          bash scripts/verify-watch-embed.sh \
            "$RUNNER_TEMP/HealthComp-DerivedData/Build/Products/Release-iphoneos/HealthComp.app"

      - name: Build unsigned Debug device configuration
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          set -euo pipefail
          xcodebuild build \
            -project HealthComp.xcodeproj \
            -scheme HealthComp \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/HealthComp-DerivedData" \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            -xcconfig Configuration/CI.xcconfig \
            COMPILER_INDEX_STORE_ENABLE=NO \
            SUPABASE_URL="$SUPABASE_URL" \
            SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
          bash scripts/verify-app-privacy-manifest.sh --app-bundle \
            "$RUNNER_TEMP/HealthComp-DerivedData/Build/Products/Debug-iphoneos/HealthComp.app"
          bash scripts/verify-watch-embed.sh \
            "$RUNNER_TEMP/HealthComp-DerivedData/Build/Products/Debug-iphoneos/HealthComp.app"

      - name: Verify source tree remains clean
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code
          [[ -z "$(git status --porcelain --untracked-files=all)" ]]

  ios:
    name: Debug tests
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Restore Swift package checkouts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/HealthComp-DerivedData/SourcePackages
          key: spm-xcode16.4-${{ hashFiles('HealthComp.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-xcode16.4-

      - name: Prepare pinned iOS Simulator
        timeout-minutes: 10
        run: |
          set -euo pipefail
          xcrun simctl list runtimes
          xcrun simctl list devices available
          # Own one exact device instead of relying on the runner's device catalog.
          simulator_id="$(xcrun simctl create \
            'HealthComp CI' \
            com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro \
            com.apple.CoreSimulator.SimRuntime.iOS-18-5)"
          printf 'HEALTHCOMP_CI_SIMULATOR_ID=%s\n' "$simulator_id" >> "$GITHUB_ENV"
          xcrun simctl bootstatus "$simulator_id" -b

      - name: Test iOS application logic, invitation copy, and privacy disclosures
        id: app_tests
        run: |
          set -euo pipefail
          # Pull requests run the unit tests and one UI test per main flow.
          # Nightly and manual runs add every other listed UI test.
          ui_tests=(
            MultiUserCompetitionUITests/testWelcomeIsSignInAndPrivacyPolicyOnly
            MultiUserCompetitionUITests/testCreateRemoteUpdatesHistoryAnonymizationRematchAndArchive
            MultiUserCompetitionUITests/testCopyCustomSchemeInvitationIncludesTheCompleteLink
            MultiUserCompetitionUITests/testRemoteDayDrawerShowsRingsThatAddUpToTheDayScore
            MultiUserCompetitionUITests/testPracticeMatchStartsFromEmptyHomeAndEndsFromTheMenu
            MultiUserCompetitionUITests/testAccountEditingAndPrivacyBoundariesRemainAccessible
            MultiUserCompetitionUITests/testSignOutAsksFirstAndStatesTheEffect
            FriendsUITests/testSearchAddThenCancelTheRequest
            FriendsUITests/testAcceptAndDeclineARequest
            ChallengeFriendUITests/testPickAFriendConfirmAndSend
            GroupMatchCreateUITests/testFormatPickerOffersEveryFormat
            GroupMatchJoinUITests/testInviteShowsTheLineupAndAnswers
            GroupMatchHomeUITests/testHomeCardsCarryTheirState
            GroupMatchLiveUITests/testLiveFreeForAllShowsStandingsAndTheWeek
            GroupMatchLiveDoublesUITests/testLiveDoublesShowsBothTeams
            GroupMatchVersusUITests/testFreeForAllIntroShowsTheLineupThenTheMatch
            GroupMatchResultUITests/testTiedResultSaysNoBelt
            GroupMatchHistoryUITests/testRecordShowsEachKindOfMatch
          )
          if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then
            ui_tests+=(
              MultiUserCompetitionUITests/testCreatingInvitationRequiresConfirmingAnExistingAccount
              MultiUserCompetitionUITests/testCopyCustomSchemeRematchIncludesTheCompleteLink
              MultiUserCompetitionUITests/testAccountDeletionFailureShowsUnderDeleteRow
              MultiUserCompetitionUITests/testRemoteCompetitionAppearanceAndTypeSizeMatrix
              MultiUserCompetitionUITests/testHealthOnboardingDisclosesSharedDerivedActivity
              MultiUserCompetitionUITests/testRemoteInvitationDisclosesSharedDerivedActivity
              MultiUserCompetitionUITests/testWelcomeWithPendingChallengeAsksToSignIn
              MultiUserCompetitionUITests/testChallengeHealthOnboardingFramesTheMatch
              MultiUserCompetitionUITests/testNotificationsPageOpensSettingsAndUnmutes
              MultiUserCompetitionUITests/testHealthPageOpensSettings
              BlockChallengerUITests/testDeclineAndBlockDisablesTheScreenThenLeavesHomeAndListsThemInAccount
              FriendsAccountUITests
              FriendsUITests
              ChallengeFriendUITests
              WhatItTakesUITests/testWhatItTakesPanelForEveryRemoteState
              MultiUserCompetitionUITests/testBeltShowsOnHomeHistoryAndThePersonPage
              BeltUITests/testHistoryRecordsPassTheAuditAtAccessibility5
              MultiUserCompetitionUITests/testShareResultPreviewsTheImageAndRemembersHideName
              RecapCardUITests/testShareOpensTheSystemSheetWithSaveImage
              WidgetUITests/testMatchWidgetShowsTheSampleScoreAndPicksAPerson
              MultiUserCompetitionUITests/testStaleMatchOffersOneNudgeADay
              NudgeUITests/testFailedNudgeRetriesAndARefusalExplains
              RecordsAndBadgesUITests
              MultiUserCompetitionUITests/testReactionsOnHomeMatchDayDrawerAndResult
              ReactionsUITests/testDraggingTheDrawerFromAChipSendsNoReaction
              ReactionsUITests/testLogoUpdatesThenShowsTodaysRings
              LiveActivityUITests/testPreviewShowsEveryScoreStateInTheAppsWords
              PracticeMatchUITests/testAFailedStartExplainsOnTheSheetAndAReopenedSheetStartsClean
              NotificationChoicesUITests/testSwitchesRegisterServerHeldKindsAndRetryAfterAFailure
              NotificationChoicesUITests/testMutedNameUsesFullLeadingEdgeAtLargestTextSize
              GroupMatchCreateUITests/testFourWayLineupFillsSeatsAndDropsToThreeWay
              GroupMatchJoinUITests/testDidNotStartOffersTheHostANewMatch
              GroupMatchLiveUITests/testLeaveMatchConfirmsAndShowsYouLeft
              GroupMatchLiveDoublesUITests/testBanterShowsUnderTheLeadLine
              GroupMatchResultUITests/testFreeForAllResultShowsSharedPlacesAndRematch
              GroupMatchResultUITests/testDoublesResultShowsTeamsTiesAndWhoCarried
              GroupMatchResultUITests/testJudgesRevealPlaysOnceBeforeAFourWayResult
              JudgesDecisionUITests/testSkipReplayAndSeenOnNextVisit
              JudgesDecisionUITests/testDraw
              BeltCeremonyUITests/testTapSkipsAndTheBannerReplays
              GroupMatchVersusUITests/testReplaysFromTheMenuOnALaterDay
              GroupMatchHistoryUITests/testGroupMatchesSitBelowTheDuelRecordOnlyWhenThereAreSome
              VersusIntroUITests/testEveryMatchupEndsByItself
              VersusIntroUITests/testMenuReplaysRepeatedlyWithoutReenablingAutoplay
              VersusIntroUITests/testMenuReplaysAfterDayOne
              VersusIntroUITests/testReduceMotionShowsTheComposedScreenAndATapEndsIt
              VersusIntroUITests/testReduceMotionEndsByItself
              VersusIntroUITests/testPlaysForTheAccepterOverTheMatchThenNeverAgain
              MultiUserCompetitionUITests/testColdWarmAndSignedOutClaimConfirmationFlows
            )
          fi
          xcodebuild test \
            -project HealthComp.xcodeproj \
            -scheme HealthComp \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$HEALTHCOMP_CI_SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/HealthComp-DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/HealthComp-AppTests.xcresult" \
            -only-testing:HealthCompTests \
            "${ui_tests[@]/#/-only-testing:HealthCompUITests/}" \
            -retry-tests-on-failure \
            -test-iterations 2 \
            -parallel-testing-enabled NO \
            -maximum-concurrent-test-simulator-destinations 1 \
            -maximum-parallel-testing-workers 1 \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            -xcconfig Configuration/CI.xcconfig \
            COMPILER_INDEX_STORE_ENABLE=NO \
            SUPABASE_URL="$SUPABASE_URL" \
            SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      - name: List tests that needed a retry
        if: ${{ always() && steps.app_tests.outcome != 'skipped' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          retried="$(xcrun xcresulttool get test-results tests \
            --path "$RUNNER_TEMP/HealthComp-AppTests.xcresult" |
            jq -r '.. | objects | select(.nodeType == "Test Case")
              | select([.children[]? | select(.nodeType == "Repetition")] | length > 1)
              | "- \(.nodeIdentifier // .name): \(.result)"')"
          {
            echo "### Tests that needed a retry"
            echo "${retried:-None.}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retain synthetic app-test failure evidence
        if: ${{ failure() && steps.app_tests.outcome == 'failure' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-app-test-failure-${{ github.run_attempt }}
          path: ${{ runner.temp }}/HealthComp-AppTests.xcresult
          retention-days: 3
          if-no-files-found: warn
          include-hidden-files: false

      - name: Verify source tree remains clean
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code
          [[ -z "$(git status --porcelain --untracked-files=all)" ]]

      - name: Remove dedicated CI Simulator
        if: ${{ always() && env.HEALTHCOMP_CI_SIMULATOR_ID != '' }}
        run: |
          xcrun simctl shutdown "$HEALTHCOMP_CI_SIMULATOR_ID" || true
          xcrun simctl delete "$HEALTHCOMP_CI_SIMULATOR_ID"

  staging:
    name: Staging tests and device build
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Restore Swift package checkouts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/HealthComp-DerivedData/SourcePackages
          key: spm-xcode16.4-${{ hashFiles('HealthComp.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-xcode16.4-

      - name: Prepare pinned iOS Simulator
        timeout-minutes: 10
        run: |
          set -euo pipefail
          xcrun simctl list runtimes
          xcrun simctl list devices available
          # Own one exact device instead of relying on the runner's device catalog.
          simulator_id="$(xcrun simctl create \
            'HealthComp CI' \
            com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro \
            com.apple.CoreSimulator.SimRuntime.iOS-18-5)"
          printf 'HEALTHCOMP_CI_SIMULATOR_ID=%s\n' "$simulator_id" >> "$GITHUB_ENV"
          xcrun simctl bootstatus "$simulator_id" -b

      - name: Test release-style Staging browser configuration
        run: |
          set -euo pipefail
          # Dedicated tests avoid importing DEBUG-only Test Lab fixtures.
          # CI.xcconfig's Simulator testability permits @testable imports
          # without enabling DEBUG.
          xcodebuild test \
            -project HealthComp.xcodeproj \
            -scheme 'HealthComp Staging' \
            -configuration Staging \
            -destination "platform=iOS Simulator,id=$HEALTHCOMP_CI_SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/HealthComp-DerivedData" \
            -only-testing:HealthCompStagingTests \
            -parallel-testing-enabled NO \
            -maximum-concurrent-test-simulator-destinations 1 \
            -maximum-parallel-testing-workers 1 \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            -xcconfig Configuration/CI.xcconfig \
            COMPILER_INDEX_STORE_ENABLE=NO \
            SUPABASE_URL="$SUPABASE_URL" \
            SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      - name: Build unsigned Staging device configuration
        run: |
          set -euo pipefail
          xcodebuild build \
            -project HealthComp.xcodeproj \
            -scheme HealthComp \
            -configuration Staging \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/HealthComp-DerivedData" \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            -xcconfig Configuration/CI.xcconfig \
            COMPILER_INDEX_STORE_ENABLE=NO \
            SUPABASE_URL="$SUPABASE_URL" \
            SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
          bash scripts/verify-app-privacy-manifest.sh --app-bundle \
            "$RUNNER_TEMP/HealthComp-DerivedData/Build/Products/Staging-iphoneos/HealthComp.app"
          bash scripts/verify-watch-embed.sh \
            "$RUNNER_TEMP/HealthComp-DerivedData/Build/Products/Staging-iphoneos/HealthComp.app"

      - name: Verify source tree remains clean
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code
          [[ -z "$(git status --porcelain --untracked-files=all)" ]]

      - name: Remove dedicated CI Simulator
        if: ${{ always() && env.HEALTHCOMP_CI_SIMULATOR_ID != '' }}
        run: |
          xcrun simctl shutdown "$HEALTHCOMP_CI_SIMULATOR_ID" || true
          xcrun simctl delete "$HEALTHCOMP_CI_SIMULATOR_ID"
